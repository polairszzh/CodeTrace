name: AI Code Review
"on":
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD -- . \
            ':(exclude).github/workflows/*' > /tmp/pr.diff

      - name: Call LLM & post comment
        uses: actions/github-script@v7
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || 'https://api.deepseek.com/v1' }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'deepseek-chat' }}
        with:
          script: |
            const fs = require("fs");
            const diff = fs.readFileSync("/tmp/pr.diff", "utf-8").slice(0, 12000);
            if (!diff.trim()) {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner, repo: context.repo.repo,
                body: "## AI Code Review\n\nNo code changes, skipping.",
              });
              return;
            }
            const systemMsg = "You are a code review assistant. Review the PR diff. Write in Chinese. Format:\n## Summary\nOne-line overview.\n## Issues\n- critical: line description\n- suggestion: line suggestion\n## Highlights\n- good designs or notable changes\nIf no issues, reply LGTM. Max 500 chars.";
            const payload = {
              model: process.env.LLM_MODEL,
              messages: [
                { role: "system", content: systemMsg },
                { role: "user", content: "PR diff:\n" + diff },
              ],
              temperature: 0.1,
            };
            let review = "";
            try {
              const resp = await fetch(process.env.LLM_BASE_URL + "/chat/completions", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "Authorization": "Bearer " + process.env.LLM_API_KEY,
                },
                body: JSON.stringify(payload),
              });
              const data = await resp.json();
              review = data?.choices?.[0]?.message?.content || "(empty response)";
            } catch (e) {
              review = "LLM call failed: " + e.message + ". Check LLM_API_KEY in repo secrets.";
            }
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner, repo: context.repo.repo,
              body: "## AI Code Review\n\n" + review + "\n\n---\n_Model: " + process.env.LLM_MODEL + " | via GitHub Actions_",
            });
